# Free web service; Supabase supplies PostgreSQL and private file storage.
services:
  - type: web
    name: orthoflow
    runtime: node
    plan: free
    region: singapore
    branch: main
    buildCommand: npm ci --include=dev --prefix code/backend && npm run db:generate --prefix code/backend && npm ci --include=dev --prefix code/frontend && npm run build --prefix code/frontend
    startCommand: npm run db:deploy --prefix code/backend && npm start --prefix code/backend
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 24.15.0
      - key: NODE_ENV
        value: production
      - key: TZ
        value: Asia/Colombo
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: STORAGE_PROVIDER
        value: supabase
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: orthoflow-private
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: CRON_SECRET
        generateValue: true
      - key: REMINDERS_ENABLED
        value: 'false'
      - key: REMINDER_ADVANCE_HOURS
        value: '24'
